name: Teams Meeting Nudges

on:
  schedule:
    # Every 10 minutes, 11:00–23:59 UTC = 08:00–20:59 America/Sao_Paulo,
    # Monday to Friday. The endpoint also checks working hours in the app
    # timezone, and its ledger guarantees one nudge per meeting even when
    # GitHub delays or overlaps runs.
    - cron: "*/10 11-23 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só contar, sem enviar (1 = sim)"
        required: false
        default: "1"

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Teams meeting nudges
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          QUERY=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            QUERY="?ignoreWorkingHours=1&dryRun=${DRY_RUN:-1}"
          fi
          curl -f -X POST "${{ secrets.APP_URL }}/api/cron/teams-meeting-nudges${QUERY}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 280
